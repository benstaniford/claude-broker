name: Release

# scripts/make-release pushes the next vX.Y.Z tag; this builds the .deb for it and
# publishes a GitHub Release with the package attached.
on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write

jobs:
  deb:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Unit tests
        run: python -m unittest discover -s tests -t . -v

      - name: Build the .deb
        id: build
        env:
          DEB_MAINTAINER: ${{ vars.DEB_MAINTAINER }}
        run: |
          VERSION="${GITHUB_REF_NAME#v}"
          DEB="$(scripts/build-deb "$VERSION" dist)"
          echo "deb=$DEB" >> "$GITHUB_OUTPUT"
          dpkg-deb --info "$DEB"
          dpkg-deb --contents "$DEB"

      - name: Check the zipapp
        run: |
          mkdir -p extracted
          dpkg-deb -x "${{ steps.build.outputs.deb }}" extracted
          test "$(python3 extracted/usr/bin/claude-broker version)" = "${GITHUB_REF_NAME#v}"

      - name: Publish the release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "$GITHUB_REF_NAME" "${{ steps.build.outputs.deb }}" \
            --title "$GITHUB_REF_NAME" --generate-notes --verify-tag
